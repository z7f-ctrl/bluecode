# bluecode（小蓝）打包配置（v0.7 阶段二）
# pipx 安装：pipx install . → 全局可用 blue 命令（blue "需求" / blue init / blue doctor）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluecode"
version = "0.8.4"
description = "小蓝 Blue —— 基于 LangGraph 的本地个人 coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-openai>=1.4",
    "langchain-core>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
fancy = ["rich"]      # 审批详情的 diff 渲染/语法高亮（缺失自动降级纯文本）
graph = ["grandalf"]  # blue --show-graph 打印图拓扑
web = ["fastapi>=0.115", "uvicorn>=0.30"]  # blue web 控制台（v0.8）
test = ["httpx>=0.27"]                      # web/tests/smoke_web.py 冒烟测试（TestClient/SSE 读取）

# 平铺脚本项目：无包目录，顶层模块（#7 模块拆分后 agent 为 facade，重导出 session/cli/doctor）
[project.scripts]
blue = "agent:main"

[tool.setuptools]
py-modules = ["agent", "tools", "prompts", "session", "cli", "doctor", "models", "webclient"]
packages = ["web"]

[tool.setuptools.package-data]
web = ["static/**/*"]
